services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applypilot
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  bot:
    build: ./backend
    env_file: .env
    command: python -m app.telegram.bot
    depends_on: [backend]
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:

